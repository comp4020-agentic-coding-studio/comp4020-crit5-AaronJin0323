<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labyrinth: Favour of the Gods</title>
    <meta
      name="description"
      content="A tiny Greek-myth roguelike. Five chambers, two gods' favour, and the Minotaur waiting at the end."
    />

    <!-- Absolute, not "./card.png": most scrapers won't resolve a relative
         og:image, and this site has exactly one deployed home. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Labyrinth: Favour of the Gods" />
    <meta
      property="og:description"
      content="A tiny Greek-myth roguelike. Five chambers, two gods' favour, and the Minotaur waiting at the end."
    />
    <meta
      property="og:url"
      content="https://comp4020-agentic-coding-studio.github.io/comp4020-crit5-AaronJin0323/"
    />
    <meta
      property="og:image"
      content="https://comp4020-agentic-coding-studio.github.io/comp4020-crit5-AaronJin0323/card.png"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <nav class="hud">
      <h1 class="crest">
        <span class="crest-mark" aria-hidden="true"></span>
        <span class="crest-word">LABYRINTH</span>
      </h1>

      <div class="vitals">
        <div class="hearts" data-hearts aria-label="Life"></div>
        <div class="gifts" data-gifts aria-label="Favour"></div>
      </div>

      <ol class="chambers" data-chambers aria-label="Chambers"></ol>

      <button class="mute" type="button" data-mute aria-pressed="false">
        <span class="mute-label">SOUND</span>
        <svg class="fig fig-lyre" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path class="lyre-arms" d="M8.5 25.5C5 20 4.5 13 7 6.5M23.5 25.5C27 20 27.5 13 25 6.5" />
          <path class="lyre-yoke" d="M6.4 9.5 25.6 9.5" />
          <path class="lyre-strings" d="M12 11.4v13M16 10.9v13.6M20 11.4v13" />
          <path class="lyre-base" d="M7.4 25.4h17.2" />
          <path class="lyre-cut" d="M4 28 28 4" />
        </svg>
      </button>
    </nav>

    <main class="hall">
      <div class="stage" data-stage>
        <div class="board" data-board></div>

        <!-- Ariadne's thread. One polyline over every tile Theseus has stood
             on in this chamber; the renderer rewrites its points each turn. -->
        <svg
          class="thread"
          data-thread
          viewBox="0 0 9 9"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <polyline class="thread-line" data-thread-line points="" />
        </svg>

        <div class="actors" data-actors></div>

        <!-- The only thing on the opening screen that moves. It points at the
             one tile the first press should reach. -->
        <div class="hint" data-start aria-hidden="true">
          <svg viewBox="0 0 32 24" focusable="false">
            <path d="M16 3 30 19h-7L16 11 9 19H2z" />
          </svg>
        </div>

        <!-- Sits over the arena's top wall row, so it costs no floor. -->
        <div class="boss" data-boss hidden>
          <span class="boss-name">THE MINOTAUR</span>
          <div class="boss-bar"><i data-boss-fill></i></div>
        </div>
      </div>

      <div class="overlay gift" data-gift hidden>
        <p class="gift-eyebrow">FAVOUR</p>
        <div class="gods" data-gods role="group" aria-label="Favour"></div>
      </div>

      <div class="overlay end" data-ending data-ended="" hidden>
        <p class="verdict" data-verdict></p>
        <dl class="tally" data-tally></dl>
        <div class="favour" data-favour></div>
        <button class="again" type="button" data-again>AGAIN</button>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
