<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labyrinth: Favour of the Gods</title>
    <meta
      name="description"
      content="A tiny Greek-myth roguelike. Five chambers, two gods' favour, and the Minotaur waiting at the end."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The only landmark on a one-screen game: the run's own status. -->
    <nav class="hud" aria-label="Run">
      <h1>Labyrinth<span>Favour of the Gods</span></h1>
      <div class="hearts" data-hearts aria-live="polite" aria-label="Life"></div>
      <div class="chambers" data-chambers aria-label="Chambers"></div>
      <button class="mute" data-mute type="button" aria-pressed="false">
        <span aria-hidden="true">♪</span><span class="sr">Sound</span>
      </button>
    </nav>

    <main>
      <div class="stage" data-stage>
        <div class="board" data-board></div>
        <div class="actors" data-actors></div>
        <!--
          The whole opening lesson, and the only thing on screen that asks for
          anything: a chevron over Theseus, pointing at the open floor and the
          lit doorway beyond it. It retires itself the moment he first moves.
        -->
        <div class="hint" data-start>▲</div>
      </div>

      <!-- Shown only while the Minotaur lives. -->
      <div class="boss" data-boss hidden>
        <div class="boss-bar"><i data-boss-fill></i></div>
      </div>
    </main>

    <div class="overlay gift" data-gift hidden>
      <div class="gods" data-gods></div>
    </div>

    <div class="overlay end" data-ending data-ended="" hidden>
      <p class="verdict" data-verdict></p>
      <dl class="tally" data-tally></dl>
      <div class="favour" data-favour></div>
      <button class="again" data-again type="button">Enter again</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
